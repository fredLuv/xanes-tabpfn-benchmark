name: Verify saved evidence
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r environments/report.txt
      - run: python -m xanes_benchmark verify
      - run: python -m xanes_benchmark.stability
      - run: python scripts/execute_notebook.py
      - run: python scripts/reproduce.py --model rf --phase test --dry-run
      - run: python scripts/reproduce.py --model tabpfn --phase importance --dry-run
